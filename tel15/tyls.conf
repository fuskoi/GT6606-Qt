#this is config file
# GT6606 丝印 COM1..4 → ttyAMA0..3
# COM1 电机  COM2 水位  COM3 编码器  COM4 传感器(转子+库仑)
# HOST/Relay 挂无端子 COM5/6（Socket+Qt，继电器模块不用）
HOST_COMPUTER = 5
DC_MOTOR = 1
ZigBee = 2
Encoder = 3
Sensor = 4
Relay = 6
#波特率配置（与上面对应）
baudrate1 = 115200
baudrate2 = 38400
baudrate3 = 38400
baudrate4 = 9600
baudrate5 = 57600
baudrate6 = 9600
#站码
StationID = 20250328
CenterStationID = 0
#Mobus设备地址，填10进制数据即可，比如地址0x01直接填1 ，0x02直接填2
Motor_Drive_car_Addr =  1
Motor_Drive_fish_Addr = 2
Encoder_car_Addr = 1
Encoder_fish_Addr = 2
Relay_2_port_power_Addr = 1
Relay_2_port_break_Addr = 2
Relay_8_port_Addr = 3
Rotator_Addr = 1
WaterLevel_Addr = 1
TouchScreenAddr = 16
Coulomb_Addr = 2
Electroc_door_Addr = 3

RotatorMeasureTime = 30

WaterType = 0         #0-雷达水位计  255 - 被动水位
WaterBase =600
CarDistenseAdjust = 5
FishDistenseAdjust = 5
a_value = 0.0096
b_value = 0.05
Circel_value = 1
StandbyTime = 60
#ultrasonic = 6

# 本地流量计算（LogLocalWaterFlow）
FlowLeftBankCoef = 0.75    
FlowRightBankCoef = 0.85   
FlowLineCoef = 1.0 
FlowMatchTolCm = 50     

# 网页通信链路：0=DTU串口（全功能）  1=Socket以太网（全功能，与 DTU 互斥）
# GT6606 默认走 Socket；COM1..6 = /dev/ttyAMA0..5，可用 UartDevN= 覆盖
WebLinkMode = 1
SocketServerIP = 222.180.168.25
SocketServerPort = 6105
# 启动脚本 run_tel15.sh 选路：auto|eth0|usb0
PreferUplink = auto
# 默认关看门狗，现场确认后再置 1
WatchdogEnable = 0
# 无操作息屏分钟：0=不息屏，1/3/5 可选
ScreenBlankMinutes = 5
