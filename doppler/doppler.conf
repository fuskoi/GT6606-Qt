# Doppler on GT6606 (board defaults: COM1..6 -> /dev/ttyAMA0..5)

# 通信端口（序号 1..6）
HOST_COMPUTER = 1
Sensor = 5
Dam5213 = 6

# 可选：覆盖设备节点，例如 USB 转串口
# UartDev1 = /dev/ttyUSB0
# UartDev5 = /dev/ttyUSB2

# 波特率
baudrate1 = 57600
baudrate5 = 9600
baudrate6 = 38400

FlowMeter_Addr = 1
FlowMeter_Addr2 = 2
Dam5213_Addr = 3

StationID = 20250328
CenterStationID = 0
Password = 4660

CollectInterval = 10
ReportInterval = 30
SensorTimeoutSec = 5

# 无外设先点亮：内部模拟传感器数据
SensorSimulate = 1

# GT6606 NXP 看门狗：固定约 10 秒，不支持改超时 / magic close。
# 设为 1 后打开即计时，应用内每 1 秒喂狗；异常退出可能导致板子重启。
WatchdogEnable = 1

# 网页链路：0=DTU串口  1=Socket（内网测 / 4G 生产都用 Socket，不改协议）
# 4G 模组 EC800K 提供 usb0，不要把 DTU 绑到 ttyUSB（那是 AT 口）
WebLinkMode = 1
# 原 DTU 中心站（公网）；内网联调可改回 192.168.101.180:8911
SocketServerIP = 222.180.168.25
SocketServerPort = 8911
# 启动脚本 run_doppler.sh 选路：auto|eth0|usb0
# auto：私网地址优先 eth0（插网线测内网）；公网 / 无 eth0 走 usb0（4G）
PreferUplink = auto

# 无操作自动息屏（分钟，1~5）；菜单「息屏设置」可改
ScreenBlankMinutes = 1
