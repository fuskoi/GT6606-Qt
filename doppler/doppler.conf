# Doppler on GT6606 (board defaults: COM1..6 -> /dev/ttyAMA0..5)

# 通信端口（序号 1..6）
HOST_COMPUTER = 1
Sensor = 5
Dam5213 = 6

# 可选：覆盖设备节点，例如 USB 转串口
# UartDev1 = /dev/ttyUSB0
# UartDev5 = /dev/ttyUSB2

# 波特率
baudrate1 = 57600
baudrate5 = 9600
baudrate6 = 38400

FlowMeter_Addr = 1
FlowMeter_Addr2 = 2
Dam5213_Addr = 3

StationID = 20250330
CenterStationID = 0
Password = 4660

CollectInterval = 10
ReportInterval = 30
SensorTimeoutSec = 5

# 无外设先点亮：内部模拟传感器数据
SensorSimulate = 1

# GT6606 NXP 看门狗：固定约 10 秒，不支持改超时 / magic close。
# 设为 1 后打开即计时，应用内每 1 秒喂狗；异常退出可能导致板子重启。
WatchdogEnable = 0

# 网页链路：0=DTU串口  1=Socket
WebLinkMode = 1
SocketServerIP = 192.168.101.180
SocketServerPort = 8911
