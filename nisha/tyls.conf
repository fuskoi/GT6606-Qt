# 通辽泥沙升降 — GT6606（COM1..6 = /dev/ttyAMA0..5）
# Qt 液晶屏替代原 LORA 串口屏，故不配置 LORA_SCREEN / UART1

UART2_ROLE = SERVER
UART3_ROLE = ACTIVE
UART4_ROLE = ACTIVE
UART5_ROLE = ACTIVE
UART6_ROLE = ACTIVE
UART2_BAUDRATE = 57600
UART3_BAUDRATE = 9600
UART4_BAUDRATE = 9600
UART5_BAUDRATE = 19200
UART6_BAUDRATE = 9600
#port:12815
# 旧 DTU 串口角色（仅 WebLinkMode=0 时使用）；Socket/4G 生产不依赖此口
4G_DTU = 2
SEDIMENT_SENSOR = 3
DEPTH_SENSOR = 3
DC_MOTOR = 5
RELAY_MODULE = 6
# 默认关看门狗，避免调试误重启；现场确认后再置 1
DOG = 0
#StationID = 10280010
StationID = 20250330

# 台架仅接泥沙传感器时置 1：模拟深度计/电机/继电器（泥沙仍真实）
# 外设接齐后务必改回 0
SimMissingDevices = 1

# 网页链路：0=4G_DTU 串口  1=Socket（与多普勒同板：内网/4G 都用 Socket）
# 4G 模组 EC800K 提供 usb0，不要把 DTU 绑到 ttyUSB（那是 AT 口）
WebLinkMode = 1
# 与多普勒同一中心站；内网联调可改回 192.168.101.180:8911
SocketServerIP = 222.180.168.25
SocketServerPort = 8911
# 启动脚本 run_nisha.sh 选路：auto|eth0|usb0
# auto：私网地址优先 eth0；公网 / 无 eth0 走 usb0（4G）
PreferUplink = auto
